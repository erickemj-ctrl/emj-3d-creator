<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMJ App 3D Creator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f5f7; --bg2: #fff; --bg3: #e8e8ed; --border: #d1d1d6;
      --t1: #1d1d1f; --t2: #6e6e73; --t3: #86868b;
      --accent: #0071e3; --success: #34c759; --warning: #ff9500; --danger: #ff3b30;
      --grad: linear-gradient(135deg, #0071e3, #5856d6);
      --ai: linear-gradient(135deg, #667eea, #764ba2);
      --panel-bg: rgba(255,255,255,0.92); --panel-blur: blur(20px);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:#2d2d30; color:var(--t1); height:100vh; overflow:hidden; user-select:none; }
    #canvas3d { position:absolute; top:0; left:0; width:100vw; height:100vh; z-index:0; overflow:hidden; }

    /* Floating panel base */
    .fpanel {
      position:absolute; z-index:10;
      background:var(--panel-bg); backdrop-filter:var(--panel-blur); -webkit-backdrop-filter:var(--panel-blur);
      border:1px solid var(--border); border-radius:14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.08);
      padding:8px; display:flex; gap:4px; align-items:center;
    }
    .fbtn {
      width:48px; height:48px; border-radius:10px; border:none; background:transparent;
      color:var(--t2); cursor:pointer; display:flex; flex-direction:column; align-items:center;
      justify-content:center; font-size:10px; gap:2px; transition:all .15s; position:relative;
    }
    .fbtn i { font-size:18px; }
    .fbtn:hover { background:var(--bg3); color:var(--t1); }
    .fbtn.active { background:var(--accent); color:#fff; }
    .fbtn.active i { color:#fff; }
    .fbtn[disabled] { opacity:.3; pointer-events:none; }
    .fsep { width:1px; height:32px; background:var(--border); margin:0 2px; flex-shrink:0; }

    .bar-tools { left:12px; top:50%; transform:translateY(-50%); flex-direction:column; }
    .bar-view { right:12px; top:12px; }
    .bar-camera { right:12px; bottom:12px; flex-direction:column; }
    .bar-add { left:50%; bottom:12px; transform:translateX(-50%); }
    .bar-shapes { left:50%; bottom:76px; transform:translateX(-50%); display:none; }
    .bar-shapes.open { display:flex; }
    .bar-project { left:12px; top:12px; gap:8px; padding:6px 12px; }
    .bar-status { left:12px; top:64px; font-size:10px; color:var(--t3); padding:4px 14px; }

    .ctx-panel {
      position:absolute; z-index:15; right:12px; top:50%; transform:translateY(-50%);
      width:240px; background:var(--panel-bg); backdrop-filter:var(--panel-blur); -webkit-backdrop-filter:var(--panel-blur);
      border:1px solid var(--border); border-radius:14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      padding:14px; display:none; max-height:80vh; overflow-y:auto;
    }
    .ctx-panel.open { display:block; }
    .ctx-section { margin-bottom:12px; }
    .ctx-label { font-size:9px; font-weight:600; color:var(--t3); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
    .ctx-row { display:flex; align-items:center; gap:4px; margin-bottom:4px; }
    .ctx-row label { font-size:11px; color:var(--t2); min-width:16px; text-align:right; }
    .ctx-row input[type=number], .ctx-row input[type=text], .ctx-row select {
      flex:1; padding:5px 6px; border:1px solid var(--border); border-radius:6px;
      font-size:11px; background:var(--bg); color:var(--t1); outline:none;
    }
    .ctx-row input:focus { border-color:var(--accent); }
    .ctx-row input[type=color] { width:32px; height:32px; border:1px solid var(--border); border-radius:6px; cursor:pointer; padding:2px; }
    .ctx-actions { display:flex; gap:4px; margin-top:8px; }
    .ctx-btn {
      flex:1; padding:6px; border-radius:6px; border:1px solid var(--border); background:var(--bg);
      font-size:10px; font-weight:500; cursor:pointer; display:flex; align-items:center;
      justify-content:center; gap:4px; color:var(--t2); transition:all .15s;
    }
    .ctx-btn:hover { background:var(--bg3); }
    .ctx-btn.danger { color:var(--danger); border-color:rgba(255,59,48,.3); }
    .ctx-btn.danger:hover { background:rgba(255,59,48,.08); }

    .ai-panel {
      position:absolute; z-index:20; right:12px; top:12px; bottom:12px; width:340px;
      background:var(--panel-bg); backdrop-filter:var(--panel-blur); -webkit-backdrop-filter:var(--panel-blur);
      border:1px solid var(--border); border-radius:14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      display:none; flex-direction:column; overflow:hidden;
    }
    .ai-panel.open { display:flex; }
    .ai-header { padding:12px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .ai-header-left { display:flex; align-items:center; gap:8px; }
    .ai-header-left i { font-size:16px; background:var(--ai); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .ai-header-left span { font-size:13px; font-weight:600; }
    .ai-close { background:none; border:none; color:var(--t3); cursor:pointer; font-size:14px; width:28px; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center; }
    .ai-close:hover { background:var(--bg3); }
    .ai-settings { padding:10px 14px; border-bottom:1px solid var(--border); background:rgba(0,0,0,.02); }
    .ai-settings label { font-size:9px; color:var(--t3); display:block; margin-bottom:3px; text-transform:uppercase; letter-spacing:.5px; }
    .ai-settings input, .ai-settings select { width:100%; padding:5px 8px; border-radius:6px; border:1px solid var(--border); font-size:11px; margin-bottom:5px; background:var(--bg2); }
    .ai-key-row { display:flex; gap:4px; }
    .ai-key-row input { flex:1; }
    .ai-messages { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:6px; }
    .ai-msg { max-width:88%; padding:8px 12px; border-radius:10px; font-size:11px; line-height:1.5; word-wrap:break-word; }
    .ai-msg.user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
    .ai-msg.assistant { align-self:flex-start; background:var(--bg3); color:var(--t1); border-bottom-left-radius:4px; }
    .ai-msg.error { align-self:flex-start; background:rgba(255,59,48,.1); color:var(--danger); border:1px solid rgba(255,59,48,.2); }
    .ai-msg.system { align-self:center; background:none; color:var(--t3); font-size:10px; padding:4px 8px; }
    .ai-msg pre { background:rgba(0,0,0,.06); border-radius:4px; padding:6px; margin-top:4px; font-size:10px; overflow-x:auto; white-space:pre-wrap; }
    .ai-input-area { padding:8px 12px; border-top:1px solid var(--border); display:flex; gap:6px; }
    .ai-input-area textarea { flex:1; padding:8px; border-radius:8px; border:1px solid var(--border); font-size:11px; font-family:inherit; resize:none; min-height:36px; max-height:80px; outline:none; }
    .ai-input-area textarea:focus { border-color:var(--accent); }
    .ai-send { width:36px; height:36px; border-radius:8px; border:none; background:var(--ai); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
    .ai-send:hover { opacity:.85; }
    .ai-quick { padding:6px 12px; border-top:1px solid var(--border); display:flex; gap:4px; flex-wrap:wrap; }
    .ai-q { padding:4px 10px; border-radius:6px; border:1px solid var(--border); background:var(--bg2); font-size:10px; color:var(--t2); cursor:pointer; transition:all .15s; }
    .ai-q:hover { background:rgba(0,113,227,.05); color:var(--accent); border-color:var(--accent); }

    .toast {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(80px); opacity:0;
      padding:10px 18px; background:var(--bg2); border:1px solid var(--border); border-radius:10px;
      display:flex; align-items:center; gap:8px; font-size:12px; z-index:1000; transition:all .25s;
      box-shadow:0 4px 16px rgba(0,0,0,.1);
    }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
    .toast.success { border-left:3px solid var(--success); }
    .toast.error { border-left:3px solid var(--danger); }
    .toast.info { border-left:3px solid var(--accent); }
    .toast.warning { border-left:3px solid var(--warning); }

    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  </style>
</head>
<body>

<div id="canvas3d"></div>

<div class="fpanel bar-project">
  <h2 contenteditable="true" id="projectName" style="outline:none;cursor:text;padding:4px 8px;border-radius:6px;border:1px solid transparent;font-size:13px;font-weight:600;min-width:60px;" onfocus="this.style.borderColor='var(--border)'" onblur="this.style.borderColor='transparent'" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">Sin proyecto</h2>
  <span id="objCount" style="font-size:10px;color:var(--t3)"></span>
</div>

<div class="fpanel bar-status" id="statusBar">
  <span id="statusText">Listo</span>
</div>

<div class="fpanel bar-tools" id="barTools">
  <button class="fbtn active" onclick="setTool('select')" id="tSelect" title="Seleccionar (V)"><i class="fas fa-mouse-pointer"></i><span>Ver</span></button>
  <button class="fbtn" onclick="setTool('move')" id="tMove" title="Mover (W)"><i class="fas fa-arrows-alt"></i><span>Mover</span></button>
  <button class="fbtn" onclick="setTool('rotate')" id="tRotate" title="Rotar (E)"><i class="fas fa-sync-alt"></i><span>Rotar</span></button>
  <button class="fbtn" onclick="setTool('scale')" id="tScale" title="Escalar (R)"><i class="fas fa-expand-arrows-alt"></i><span>Escalar</span></button>
  <div class="fsep"></div>
  <button class="fbtn" onclick="duplicateSelected()" title="Duplicar (Ctrl+D)"><i class="fas fa-clone"></i><span>Dup</span></button>
  <button class="fbtn" onclick="deleteSelected()" title="Eliminar (Supr)"><i class="fas fa-trash"></i><span>Borrar</span></button>
  <div class="fsep"></div>
  <button class="fbtn" onclick="toggleGrid()" id="tGrid" title="Ocultar/Mostrar cuadricula"><i class="fas fa-border-all"></i><span>Grid</span></button>
  <button class="fbtn" onclick="toggleWireframe()" id="tWire" title="Modo alambre"><i class="fas fa-vector-square"></i><span>Alambre</span></button>
  <button class="fbtn" onclick="frameAll()" title="Enfocar todo (F)"><i class="fas fa-compress-arrows-alt"></i><span>Enfocar</span></button>
  <div class="fsep"></div>
  <button class="fbtn" onclick="undo()" id="tUndo" title="Deshacer (Ctrl+Z)"><i class="fas fa-undo"></i><span>Deshacer</span></button>
  <button class="fbtn" onclick="redo()" id="tRedo" title="Rehacer (Ctrl+Y)"><i class="fas fa-redo"></i><span>Rehacer</span></button>
</div>

<div class="fpanel bar-view">
  <button class="fbtn" onclick="setView('front')" title="Vista frontal"><i class="fas fa-square"></i><span>Front</span></button>
  <button class="fbtn" onclick="setView('top')" title="Vista superior"><i class="fas fa-caret-down"></i><span>Top</span></button>
  <button class="fbtn" onclick="setView('right')" title="Vista derecha"><i class="fas fa-caret-right"></i><span>Side</span></button>
  <button class="fbtn" onclick="setView('iso')" title="Vista isometrica"><i class="fas fa-cube"></i><span>Iso</span></button>
  <button class="fbtn" onclick="resetCamera()" title="Resetear camara"><i class="fas fa-crosshairs"></i><span>Reset</span></button>
</div>

<div class="fpanel bar-camera">
  <button class="fbtn" onclick="zoomIn()" title="Acercar (+)"><i class="fas fa-search-plus"></i></button>
  <button class="fbtn" onclick="zoomOut()" title="Alejar (-)"><i class="fas fa-search-minus"></i></button>
  <button class="fbtn" onclick="centerView()" title="Centrar vista"><i class="fas fa-crosshairs"></i></button>
</div>

<div class="fpanel bar-add">
  <button class="fbtn" onclick="importSTL()" title="Importar STL"><i class="fas fa-file-import"></i><span>Importar</span></button>
  <button class="fbtn" onclick="exportSTL()" title="Exportar STL"><i class="fas fa-download"></i><span>Exportar</span></button>
  <div class="fsep"></div>
  <button class="fbtn" onclick="toggleShapeStrip()" id="tAddShape" title="Agregar forma" style="width:56px;height:56px;background:var(--grad);color:#fff;border-radius:12px;"><i class="fas fa-plus" style="font-size:22px;"></i><span style="color:#fff;">Forma</span></button>
  <div class="fsep"></div>
  <button class="fbtn" onclick="toggleAIPanel()" id="tAI" title="Asistente IA"><i class="fas fa-robot"></i><span>IA</span></button>
  <button class="fbtn" onclick="newProject()" title="Nuevo proyecto"><i class="fas fa-file"></i><span>Nuevo</span></button>
</div>

<div class="fpanel bar-shapes" id="shapeStrip">
  <button class="fbtn" onclick="quickShape('box')" title="Cubo"><i class="fas fa-square"></i><span>Cubo</span></button>
  <button class="fbtn" onclick="quickShape('cylinder')" title="Cilindro"><i class="fas fa-circle"></i><span>Cilin</span></button>
  <button class="fbtn" onclick="quickShape('sphere')" title="Esfera"><i class="fas fa-basketball-ball"></i><span>Esfera</span></button>
  <button class="fbtn" onclick="quickShape('cone')" title="Cono"><i class="fas fa-caret-up"></i><span>Cono</span></button>
  <button class="fbtn" onclick="quickShape('torus')" title="Toro"><i class="fas fa-ring"></i><span>Toro</span></button>
  <button class="fbtn" onclick="quickShape('star')" title="Estrella"><i class="fas fa-star"></i><span>Estrella</span></button>
  <div class="fsep"></div>
  <button class="fbtn" onclick="addPart('screw_m3')" title="Tornillo M3"><i class="fas fa-screwdriver"></i><span>Torn</span></button>
  <button class="fbtn" onclick="addPart('nut_m3')" title="Tuerca M3"><i class="fas fa-circle"></i><span>Tuerca</span></button>
  <button class="fbtn" onclick="addPart('bracket90')" title="Bracket 90"><i class="fas fa-level-up-alt"></i><span>L-bracket</span></button>
  <button class="fbtn" onclick="addPart('snap')" title="Snap-fit"><i class="fas fa-compress"></i><span>Snap</span></button>
  <button class="fbtn" onclick="addPart('pin')" title="Pin"><i class="fas fa-thumbtack"></i><span>Pin</span></button>
  <button class="fbtn" onclick="addPart('clip')" title="Clip"><i class="fas fa-paperclip"></i><span>Clip</span></button>
  <div class="fsep"></div>
  <button class="fbtn" onclick="addPart('raspberry_pi')" title="Soporte Raspberry Pi"><i class="fas fa-microchip"></i><span>RPi</span></button>
  <button class="fbtn" onclick="addPart('arduino')" title="Soporte Arduino"><i class="fas fa-microchip"></i><span>Arduino</span></button>
</div>

<div class="ctx-panel" id="ctxPanel">
  <div class="ctx-section">
    <div class="ctx-label">Nombre</div>
    <div class="ctx-row"><input type="text" id="propName" onchange="renameSelected(this.value)"></div>
  </div>
  <div class="ctx-section">
    <div class="ctx-label">Posicion</div>
    <div class="ctx-row"><label style="color:var(--danger);font-weight:600">X</label><input type="number" id="propPx" step="1" onchange="setProp('pos','x',this.value)"></div>
    <div class="ctx-row"><label style="color:var(--success);font-weight:600">Y</label><input type="number" id="propPy" step="1" onchange="setProp('pos','y',this.value)"></div>
    <div class="ctx-row"><label style="color:var(--accent);font-weight:600">Z</label><input type="number" id="propPz" step="1" onchange="setProp('pos','z',this.value)"></div>
  </div>
  <div class="ctx-section">
    <div class="ctx-label">Rotacion</div>
    <div class="ctx-row"><label style="color:var(--danger);font-weight:600">X</label><input type="number" id="propRx" step="15" onchange="setProp('rot','x',this.value)"></div>
    <div class="ctx-row"><label style="color:var(--success);font-weight:600">Y</label><input type="number" id="propRy" step="15" onchange="setProp('rot','y',this.value)"></div>
    <div class="ctx-row"><label style="color:var(--accent);font-weight:600">Z</label><input type="number" id="propRz" step="15" onchange="setProp('rot','z',this.value)"></div>
  </div>
  <div class="ctx-section">
    <div class="ctx-label">Escala</div>
    <div class="ctx-row"><label>X</label><input type="number" id="propSx" step="0.1" min="0.01" onchange="setProp('scl','x',this.value)"></div>
    <div class="ctx-row"><label>Y</label><input type="number" id="propSy" step="0.1" min="0.01" onchange="setProp('scl','y',this.value)"></div>
    <div class="ctx-row"><label>Z</label><input type="number" id="propSz" step="0.1" min="0.01" onchange="setProp('scl','z',this.value)"></div>
  </div>
  <div class="ctx-section">
    <div class="ctx-label">Color</div>
    <div class="ctx-row"><input type="color" id="propColor" onchange="setColor(this.value)"></div>
  </div>
  <div class="ctx-actions">
    <button class="ctx-btn" onclick="duplicateSelected()"><i class="fas fa-clone"></i> Duplicar</button>
    <button class="ctx-btn danger" onclick="deleteSelected()"><i class="fas fa-trash"></i> Borrar</button>
  </div>
</div>

<div class="ai-panel" id="aiPanel">
  <div class="ai-header">
    <div class="ai-header-left"><i class="fas fa-robot"></i><span>Asistente IA</span></div>
    <button class="ai-close" onclick="toggleAIPanel()"><i class="fas fa-times"></i></button>
  </div>
  <div class="ai-settings">
    <label>API Key OpenRouter</label>
    <div class="ai-key-row"><input type="password" id="apiKeyInput" placeholder="sk-or-v1-..."><button class="fbtn" onclick="saveAPIKey()" style="width:32px;height:32px;background:var(--accent);color:#fff;border-radius:6px;flex-shrink:0;"><i class="fas fa-check"></i></button></div>
    <label>Modelo</label>
    <select id="aiModelSelect"><option value="openai/gpt-4o-mini">GPT-4o Mini</option><option value="openai/gpt-4o">GPT-4o</option><option value="deepseek/deepseek-chat">DeepSeek</option></select>
  </div>
  <div class="ai-messages" id="aiMessages"><div class="ai-msg system">Genero codigo OpenSCAD para 3D printing.</div></div>
  <div class="ai-quick">
    <div class="ai-q" onclick="aiQuick('Genera codigo OpenSCAD para un soporte de tubo')">Soporte</div>
    <div class="ai-q" onclick="aiQuick('Genera codigo OpenSCAD para un organizador de cables')">Cables</div>
    <div class="ai-q" onclick="aiQuick('Genera codigo OpenSCAD para una caja con tapa')">Caja</div>
  </div>
  <div class="ai-input-area">
    <textarea id="aiInput" rows="1" placeholder="Describe el modelo..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAI()}"></textarea>
    <button class="ai-send" id="aiSendBtn" onclick="sendAI()"><i class="fas fa-paper-plane"></i></button>
  </div>
</div>

<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMessage"></span></div>

<input type="file" id="fileInput" accept=".stl,.STL" style="display:none" onchange="handleImport(event)">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
<script>
// ========== STATE ==========
var scene, camera, renderer, orbit, transform;
var sceneObjects = [];
var selectedObj = null;
var currentTool = 'select';
var currentShapeType = 'box';
var showGrid = true;
var wireframeMode = false;
var undoStack = [];
var redoStack = [];

// ========== UNDO / REDO ==========
function saveState() {
  undoStack.push(sceneObjects.map(function(o) {
    return { name:o.name, type:o.type, shapeType:o.shapeType, params:o.params, partType:o.partType,
      pos:{x:o.mesh.position.x,y:o.mesh.position.y,z:o.mesh.position.z},
      rot:{x:o.mesh.rotation.x,y:o.mesh.rotation.y,z:o.mesh.rotation.z},
      scl:{x:o.mesh.scale.x,y:o.mesh.scale.y,z:o.mesh.scale.z}
    };
  }));
  redoStack = [];
  if (undoStack.length > 50) undoStack.shift();
}
function undo() {
  if (!undoStack.length) { toast('Nada que deshacer','info'); return; }
  redoStack.push(sceneObjects.map(function(o) {
    return { name:o.name, type:o.type, shapeType:o.shapeType, params:o.params, partType:o.partType,
      pos:{x:o.mesh.position.x,y:o.mesh.position.y,z:o.mesh.position.z},
      rot:{x:o.mesh.rotation.x,y:o.mesh.rotation.y,z:o.mesh.rotation.z},
      scl:{x:o.mesh.scale.x,y:o.mesh.scale.y,z:o.mesh.scale.z}
    };
  }));
  var state = undoStack.pop();
  restoreState(state);
  toast('Deshacer','info');
}
function redo() {
  if (!redoStack.length) { toast('Nada que rehacer','info'); return; }
  undoStack.push(sceneObjects.map(function(o) {
    return { name:o.name, type:o.type, shapeType:o.shapeType, params:o.params, partType:o.partType,
      pos:{x:o.mesh.position.x,y:o.mesh.position.y,z:o.mesh.position.z},
      rot:{x:o.mesh.rotation.x,y:o.mesh.rotation.y,z:o.mesh.rotation.z},
      scl:{x:o.mesh.scale.x,y:o.mesh.scale.y,z:o.mesh.scale.z}
    };
  }));
  var state = redoStack.pop();
  restoreState(state);
  toast('Rehacer','info');
}
function restoreState(state) {
  sceneObjects.forEach(function(o) { scene.remove(o.mesh); });
  sceneObjects = [];
  state.forEach(function(s) {
    var mesh;
    if (s.shapeType) {
      mesh = createGeometry(s.shapeType, s.params || []);
    } else if (s.partType) {
      addPartSilent(s.partType);
      return;
    } else {
      mesh = createGeometry('box', [10,10,10]);
    }
    mesh.position.set(s.pos.x, s.pos.y, s.pos.z);
    mesh.rotation.set(s.rot.x, s.rot.y, s.rot.z);
    mesh.scale.set(s.scl.x, s.scl.y, s.scl.z);
    mesh.castShadow = true; mesh.receiveShadow = true;
    scene.add(mesh);
    sceneObjects.push({ name:s.name, mesh:mesh, type:s.type, shapeType:s.shapeType, params:s.params, partType:s.partType });
  });
  selectObject(null);
  updateObjectList();
}

// ========== INIT ==========
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x4a4a52);

  var grid = new THREE.GridHelper(200, 40, 0x6a6a72, 0x5a5a62);
  grid.name = 'grid';
  scene.add(grid);

  camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 5000);
  camera.position.set(50, 40, 50);

  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById('canvas3d').appendChild(renderer.domElement);

  orbit = new THREE.OrbitControls(camera, renderer.domElement);
  orbit.enableDamping = true;
  orbit.dampingFactor = 0.08;
  orbit.rotateSpeed = 0.6;
  orbit.target.set(0, 0, 0);

  transform = new THREE.TransformControls(camera, renderer.domElement);
  transform.setSize(1);
  transform.addEventListener('dragging-changed', function(e) { orbit.enabled = !e.value; });
  transform.addEventListener('objectChange', function() { updateProperties(); });
  scene.add(transform.getHelper());

  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  scene.add(new THREE.HemisphereLight(0xffffff, 0xe0e0e0, 0.6));
  var dl = new THREE.DirectionalLight(0xffffff, 0.9);
  dl.position.set(100, 150, 100); dl.castShadow = true;
  dl.shadow.mapSize.set(2048, 2048);
  dl.shadow.camera.near = 1; dl.shadow.camera.far = 500;
  dl.shadow.camera.left = dl.shadow.camera.bottom = -150;
  dl.shadow.camera.right = dl.shadow.camera.top = 150;
  scene.add(dl);
  var dl2 = new THREE.DirectionalLight(0xffffff, 0.4);
  dl2.position.set(-80, 80, -60); scene.add(dl2);

  renderer.domElement.addEventListener('pointerdown', onPointerDown);

  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  orbit.update();
  renderer.render(scene, camera);
}

// ========== GEOMETRY HELPER ==========
function createGeometry(type, params) {
  var geo, mat;
  var color = params.color || 0x0071e3;
  if (typeof color === 'string') color = parseInt(color.replace('#',''),16);
  mat = new THREE.MeshStandardMaterial({ color: color, metalness:0.05, roughness:0.6, side:THREE.DoubleSide });

  if (type === 'box') { geo = new THREE.BoxGeometry(params[0]||20, params[2]||20, params[1]||20); }
  else if (type === 'cylinder') { geo = new THREE.CylinderGeometry(params[0]||10, params[0]||10, params[1]||20, params[2]||32); }
  else if (type === 'sphere') { geo = new THREE.SphereGeometry(params[0]||10, params[1]||32, params[1]||32); }
  else if (type === 'cone') { geo = new THREE.ConeGeometry(params[0]||10, params[1]||20, params[2]||32); }
  else if (type === 'torus') { geo = new THREE.TorusGeometry(params[0]||10, params[1]||3, 16, params[2]||32); }
  else if (type === 'star') {
    var shape = new THREE.Shape();
    var p2 = params[2] || 5;
    for (var i = 0; i < p2 * 2; i++) {
      var r = i % 2 === 0 ? (params[0]||10) : (params[1]||5);
      var a = i * Math.PI / p2 - Math.PI / 2;
      if (i === 0) shape.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      else shape.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    shape.closePath();
    geo = new THREE.ExtrudeGeometry(shape, { depth: params[3]||3, bevelEnabled:false });
  }
  var mesh = new THREE.Mesh(geo, mat);
  var bbox = new THREE.Box3().setFromObject(mesh);
  var size = bbox.getSize(new THREE.Vector3());
  mesh.position.y = size.y / 2;
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}

// ========== LEFT CLICK - SELECTION ==========
function onPointerDown(e) {
  if (e.button !== 0) return;
  if (transform.dragging) return;

  var rect = renderer.domElement.getBoundingClientRect();
  var mouse = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
  var raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, camera);

  var meshes = [];
  sceneObjects.forEach(function(o) {
    if (o.mesh.isGroup) { o.mesh.traverse(function(c) { if (c.isMesh) meshes.push({obj:o, mesh:c}); }); }
    else if (o.mesh.isMesh) { meshes.push({obj:o, mesh:o.mesh}); }
  });

  var intersects = raycaster.intersectObjects(meshes.map(function(m){return m.mesh;}), false);

  if (intersects.length > 0) {
    var hit = meshes.find(function(m){return m.mesh === intersects[0].object;});
    if (hit) {
      selectObject(hit.obj);
      if (currentTool === 'move') { transform.setMode('translate'); transform.attach(hit.obj.mesh); }
      else if (currentTool === 'rotate') { transform.setMode('rotate'); transform.attach(hit.obj.mesh); }
      else if (currentTool === 'scale') { transform.setMode('scale'); transform.attach(hit.obj.mesh); }
    }
  } else {
    selectObject(null);
    transform.detach();
  }
}

// ========== SELECTION ==========
function selectObject(obj) {
  if (selectedObj) {
    var prev = selectedObj.mesh;
    if (prev.isMesh && prev.material.emissive) prev.material.emissive.setHex(0x000000);
    else if (prev.isGroup) prev.traverse(function(c){if(c.isMesh&&c.material.emissive)c.material.emissive.setHex(0x000000);});
  }
  selectedObj = obj;
  if (obj) {
    var m = obj.mesh;
    if (m.isMesh && m.material.emissive) m.material.emissive.setHex(0x333333);
    else if (m.isGroup) m.traverse(function(c){if(c.isMesh&&c.material.emissive)c.material.emissive.setHex(0x333333);});
    if (currentTool === 'move') { transform.setMode('translate'); transform.attach(m); }
    else if (currentTool === 'rotate') { transform.setMode('rotate'); transform.attach(m); }
    else if (currentTool === 'scale') { transform.setMode('scale'); transform.attach(m); }
  } else {
    transform.detach();
  }
  document.getElementById('ctxPanel').classList.toggle('open', !!obj);
  updateObjectList();
  updateProperties();
}

// ========== TOOLS ==========
function setTool(tool) {
  currentTool = tool;
  document.querySelectorAll('.bar-tools .fbtn').forEach(function(b){b.classList.remove('active');});
  var id = 't' + tool.charAt(0).toUpperCase() + tool.slice(1);
  var btn = document.getElementById(id);
  if (btn) btn.classList.add('active');

  if (selectedObj) {
    if (tool === 'select') { transform.detach(); }
    else if (tool === 'move') { transform.setMode('translate'); transform.attach(selectedObj.mesh); }
    else if (tool === 'rotate') { transform.setMode('rotate'); transform.attach(selectedObj.mesh); }
    else if (tool === 'scale') { transform.setMode('scale'); transform.attach(selectedObj.mesh); }
  }
  setStatus(tool === 'select' ? 'Seleccionar: Click en objetos' : tool === 'move' ? 'Mover: Arrastra las flechas' : tool === 'rotate' ? 'Rotar: Arrastra los anillos' : 'Escalar: Arrastra los cubos');
}

function setView(view) {
  var d = 80;
  if (view === 'front') { camera.position.set(0, 10, d); orbit.target.set(0,10,0); }
  else if (view === 'top') { camera.position.set(0, d, 0.01); orbit.target.set(0,0,0); }
  else if (view === 'right') { camera.position.set(d, 10, 0); orbit.target.set(0,10,0); }
  else if (view === 'iso') { camera.position.set(50, 40, 50); orbit.target.set(0,0,0); }
  orbit.update();
  setStatus('Vista: ' + view);
}

function resetCamera() { setView('iso'); }

function centerView() {
  if (selectedObj) { focusCameraOn(selectedObj.mesh); }
  else { orbit.target.set(0,0,0); camera.position.set(50,40,50); orbit.update(); }
}

function zoomIn() { camera.position.lerp(orbit.target, 0.2); orbit.update(); }
function zoomOut() { var dir = camera.position.clone().sub(orbit.target).multiplyScalar(1.25); camera.position.copy(orbit.target).add(dir); orbit.update(); }

function focusCameraOn(obj) {
  var box = new THREE.Box3().setFromObject(obj);
  var center = box.getCenter(new THREE.Vector3());
  var size = box.getSize(new THREE.Vector3());
  var maxDim = Math.max(size.x, size.y, size.z);
  var dist = maxDim * 2.5;
  camera.position.set(center.x + dist * 0.7, center.y + dist * 0.5, center.z + dist * 0.7);
  orbit.target.copy(center);
  orbit.update();
}

function frameAll() {
  if (sceneObjects.length === 0) { resetCamera(); return; }
  var box = new THREE.Box3();
  sceneObjects.forEach(function(o) { box.expandByObject(o.mesh); });
  var center = box.getCenter(new THREE.Vector3());
  var size = box.getSize(new THREE.Vector3());
  var maxDim = Math.max(size.x, size.y, size.z);
  var dist = maxDim * 2;
  camera.position.set(center.x + dist * 0.7, center.y + dist * 0.5, center.z + dist * 0.7);
  orbit.target.copy(center);
  orbit.update();
}

// ========== GRID / WIREFRAME ==========
function toggleGrid() {
  showGrid = !showGrid;
  var grid = scene.getObjectByName('grid');
  if (grid) grid.visible = showGrid;
  document.getElementById('tGrid').classList.toggle('active', showGrid);
  setStatus(showGrid ? 'Cuadricula visible' : 'Cuadricula oculta');
}

function toggleWireframe() {
  wireframeMode = !wireframeMode;
  document.getElementById('tWire').classList.toggle('active', wireframeMode);
  sceneObjects.forEach(function(o) {
    if (o.mesh.isMesh) o.mesh.material.wireframe = wireframeMode;
    else if (o.mesh.isGroup) o.mesh.traverse(function(c){ if(c.isMesh) c.material.wireframe = wireframeMode; });
  });
  setStatus(wireframeMode ? 'Modo alambre' : 'Modo solido');
}

function toggleShapeStrip() {
  var strip = document.getElementById('shapeStrip');
  strip.classList.toggle('open');
  document.getElementById('tAddShape').classList.toggle('active', strip.classList.contains('open'));
}

function quickShape(type) {
  var defaults = { box:[20,20,20], cylinder:[10,20,32], sphere:[10,32], cone:[10,20,32], torus:[10,3,32], star:[10,5,5,3] };
  var color = '#0071e3';
  var names = { box:'Cubo', cylinder:'Cilindro', sphere:'Esfera', cone:'Cono', torus:'Toro', star:'Estrella' };
  var params = (defaults[type] || [10,10,10]).slice();

  toast('Creado: ' + name, 'success');

// ========== PRE-MADE PARTS ==========
function addPartSilent(type) {
  var mesh, name;
  var mat = new THREE.MeshStandardMaterial({ color:0x888888, metalness:0.7, roughness:0.3 });

  if (type === 'screw_m3' || type === 'screw_m4') {
    var r = type === 'screw_m3' ? 1.5 : 2;
    var l = type === 'screw_m3' ? 10 : 12;
    var group = new THREE.Group();
    var shaft = new THREE.Mesh(new THREE.CylinderGeometry(r,r,l,16), mat);
    shaft.position.y = l/2; group.add(shaft);
    var head = new THREE.Mesh(new THREE.CylinderGeometry(r*1.8,r*1.8,2,16), mat);
    head.position.y = l+1; group.add(head);
    mesh = group; name = type === 'screw_m3' ? 'Tornillo M3' : 'Tornillo M4';
  } else if (type === 'nut_m3' || type === 'nut_m4') {
    var nr = type === 'nut_m3' ? 3.2 : 4;
    var shape = new THREE.Shape();
    for (var i=0;i<6;i++){var a=i*Math.PI/3-Math.PI/6;i===0?shape.moveTo(Math.cos(a)*nr,Math.sin(a)*nr):shape.lineTo(Math.cos(a)*nr,Math.sin(a)*nr);}
    shape.closePath();
    var hole = new THREE.Path(); hole.absarc(0,0,nr/2,0,Math.PI*2,false); shape.holes.push(hole);
    var geo = new THREE.ExtrudeGeometry(shape,{depth:2.4,bevelEnabled:false});
    geo.rotateX(-Math.PI/2);
    mesh = new THREE.Mesh(geo,mat); name = type==='nut_m3'?'Tuerca M3':'Tuerca M4';
  } else if (type === 'bracket90') {
    var group = new THREE.Group();
    var p1 = new THREE.Mesh(new THREE.BoxGeometry(30,15,3),mat); p1.position.set(0,7.5,0); group.add(p1);
    var p2 = new THREE.Mesh(new THREE.BoxGeometry(30,15,3),mat); p2.rotation.z=-Math.PI/2; p2.position.set(0,15,0); group.add(p2);
    mesh = group; name = 'Bracket 90';
  } else if (type === 'clip') {
    mesh = new THREE.Mesh(new THREE.BoxGeometry(15,2,10), new THREE.MeshStandardMaterial({color:0x34c759,metalness:0.1,roughness:0.6}));
    name = 'Clip';
  } else if (type === 'snap') {
    var group = new THREE.Group();
    var bMat = new THREE.MeshStandardMaterial({color:0x0071e3,metalness:0.1,roughness:0.6});
    var base = new THREE.Mesh(new THREE.BoxGeometry(20,3,10),bMat); base.position.y=1.5; group.add(base);
    var h1 = new THREE.Mesh(new THREE.BoxGeometry(3,6,10),bMat); h1.position.set(-8.5,6,0); group.add(h1);
    var h2 = h1.clone(); h2.position.x=8.5; group.add(h2);
    mesh = group; name = 'Snap-fit';
  } else if (type === 'pin') {
    mesh = new THREE.Mesh(new THREE.CylinderGeometry(2,2,15,16),mat); mesh.position.y=7.5; name='Pin';
  } else if (type === 'raspberry_pi' || type === 'arduino') {
    var w = type==='raspberry_pi'?85:68.6, d = type==='raspberry_pi'?56:53.3;
    var group = new THREE.Group();
    var gMat = new THREE.MeshStandardMaterial({color:0x34c759,metalness:0.05,roughness:0.6});
    var base = new THREE.Mesh(new THREE.BoxGeometry(w+10,3,d+10),gMat); base.position.y=1.5; group.add(base);
    var wallH=8;
    [{s:[3,wallH,d+6],p:[-(w/2+4.5),3+wallH/2,0]},{s:[3,wallH,d+6],p:[(w/2+4.5),3+wallH/2,0]},
     {s:[w+6,wallH,3],p:[0,3+wallH/2,-(d/2+4.5)]},{s:[w+6,wallH,3],p:[0,3+wallH/2,(d/2+4.5)]}
    ].forEach(function(wall){
      var m=new THREE.Mesh(new THREE.BoxGeometry(wall.s[0],wall.s[1],wall.s[2]),gMat);
      m.position.set(wall.p[0],wall.p[1],wall.p[2]); group.add(m);
    });
    mesh=group; name=type==='raspberry_pi'?'Soporte RPi':'Soporte Arduino';
  }
  if (!mesh) return null;
  mesh.castShadow=true; mesh.receiveShadow=true;
  scene.add(mesh);
  var obj = { name:name+'_'+(sceneObjects.length+1), mesh:mesh, type:'part', partType:type };
  sceneObjects.push(obj);
  return obj;
}

function addPart(type) {
  saveState();
  addPartSilent(type);
  var last = sceneObjects[sceneObjects.length-1];
  if (last) { selectObject(last); updateObjectList(); focusCameraOn(last.mesh); toast('Parte: '+last.name,'success'); }
}

// ========== STL PARSER (client-side) ==========
function parseSTLBinary(bytes) {
  if (bytes.length < 84) throw new Error('Archivo STL demasiado pequeno');
  var numTriangles = (bytes[80] | (bytes[81] << 8) | (bytes[82] << 16) | (bytes[83] << 24)) >>> 0;
  if (numTriangles === 0 || numTriangles > 100000000) throw new Error('Numero de triangulos invalido: ' + numTriangles);
  var expectedSize = 84 + numTriangles * 50;
  if (bytes.length < expectedSize - 1 || bytes.length > expectedSize + 1) {
    numTriangles = Math.floor((bytes.length - 84) / 50);
  }
  var vertices = [];
  var offset = 84;
  for (var t = 0; t < numTriangles; t++) {
    if (offset + 50 > bytes.length) break;
    offset += 12;
    for (var v = 0; v < 3; v++) {
      vertices.push(
        readFloat32LE(bytes, offset),
        readFloat32LE(bytes, offset + 4),
        readFloat32LE(bytes, offset + 8)
      );
      offset += 12;
    }
    offset += 2;
  }
  return vertices;
}

function parseSTLAscii(bytes) {
  var text = '';
  for (var i = 0; i < bytes.length; i++) text += String.fromCharCode(bytes[i] & 0xFF);
  var vertices = [];
  var lines = text.split(/\r?\n/);
  for (var l = 0; l < lines.length; l++) {
    var line = lines[l].trim();
    if (line.indexOf('vertex') === 0 && line.indexOf('outer') === -1 && line.indexOf('end') === -1) {
      var parts = line.replace('vertex', '').trim().split(/\s+/);
      vertices.push(
        parseFloat(parts[0]) || 0,
        parseFloat(parts[1]) || 0,
        parseFloat(parts[2]) || 0
      );
    }
  }
  return vertices;
}

function detectSTLType(bytes) {
  if (bytes.length < 84) return 'ascii';
  var header = '';
  var len = Math.min(80, bytes.length);
  for (var i = 0; i < len; i++) {
    if (bytes[i] >= 32 && bytes[i] < 127) header += String.fromCharCode(bytes[i]);
  }
  if (header.indexOf('solid') === 0 && header.indexOf('facet') !== -1) return 'ascii';
  var numTri = (bytes[80] | (bytes[81] << 8) | (bytes[82] << 16) | (bytes[83] << 24)) >>> 0;
  if (numTri > 0 && numTri < 100000000) {
    var expected = 84 + numTri * 50;
    if (Math.abs(bytes.length - expected) <= 1) return 'binary';
  }
  try {
    var txt = '';
    for (var j = 0; j < Math.min(bytes.length, 1024); j++) txt += String.fromCharCode(bytes[j] & 0xFF);
    if (txt.indexOf('solid') !== -1 && txt.indexOf('facet') !== -1) return 'ascii';
  } catch(e) {}
  return 'binary';
}

function readFloat32LE(bytes, offset) {
  var b0 = bytes[offset] & 0xFF;
  var b1 = bytes[offset + 1] & 0xFF;
  var b2 = bytes[offset + 2] & 0xFF;
  var b3 = bytes[offset + 3] & 0xFF;
  var sign = (b3 & 0x80) ? -1 : 1;
  var exponent = ((b3 & 0x7F) << 1) | ((b2 & 0x80) >> 7);
  var mantissa = ((b2 & 0x7F) << 16) | (b1 << 8) | b0;
  if (exponent === 0) return sign * Math.pow(2, -126) * (mantissa / 8388608);
  if (exponent === 255) return sign * (mantissa === 0 ? Infinity : NaN);
  return sign * Math.pow(2, exponent - 127) * (1 + mantissa / 8388608);
}

// ========== IMPORT / EXPORT ==========
function importSTL() { document.getElementById('fileInput').click(); }

function handleImport(e) {
  var file = e.target.files[0];
  if (!file) return;
  toast('Importando ' + file.name + '...', 'info');
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var bytes = new Uint8Array(ev.target.result);
      var type = detectSTLType(bytes);
      var vertices = type === 'ascii' ? parseSTLAscii(bytes) : parseSTLBinary(bytes);

      if (vertices.length === 0) { toast('No se encontraron vertices en el STL', 'error'); return; }

      var geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geo.computeVertexNormals();
      var mat = new THREE.MeshStandardMaterial({ color: 0x0071e3, metalness: 0.05, roughness: 0.6, side: THREE.DoubleSide });
      var mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true; mesh.receiveShadow = true;

      var box = new THREE.Box3().setFromObject(mesh);
      var center = box.getCenter(new THREE.Vector3());
      mesh.position.sub(center);

      var name = file.name.replace('.stl', '').replace('.STL', '');
      scene.add(mesh);
      var obj = { name: name, mesh: mesh, type: 'stl' };
      sceneObjects.push(obj);
      selectObject(obj);
      updateObjectList();
      document.getElementById('projectName').textContent = name;
      focusCameraOn(mesh);
      toast('STL importado: ' + name + ' (' + (vertices.length / 3) + ' triangulos)', 'success');
    } catch(err) {
      toast('Error al leer STL: ' + err.message, 'error');
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}

function exportSTL() {
  if (sceneObjects.length === 0) { toast('No hay objetos','warning'); return; }
  var allPositions = [];
  sceneObjects.forEach(function(o) {
    var meshes = [];
    if (o.mesh.isGroup) { o.mesh.traverse(function(c){if(c.isMesh)meshes.push(c);}); }
    else if (o.mesh.isMesh) { meshes.push(o.mesh); }
    meshes.forEach(function(m) {
      m.updateMatrixWorld(true);
      var geo = m.geometry.clone();
      geo.applyMatrix4(m.matrixWorld);
      var pos = geo.getAttribute('position');
      for (var i=0;i<pos.count;i++) allPositions.push(pos.getX(i),pos.getY(i),pos.getZ(i));
      geo.dispose();
    });
  });
  var triangles = allPositions.length / 9;
  var buffer = new ArrayBuffer(84 + triangles * 50);
  var dv = new DataView(buffer);
  for (var i=0;i<80;i++) dv.setUint8(i,0);
  dv.setUint32(80, triangles, true);
  var offset = 84;
  for (var t=0;t<triangles;t++) {
    var ti = t*9;
    var v1x=allPositions[ti],v1y=allPositions[ti+1],v1z=allPositions[ti+2];
    var v2x=allPositions[ti+3],v2y=allPositions[ti+4],v2z=allPositions[ti+5];
    var v3x=allPositions[ti+6],v3y=allPositions[ti+7],v3z=allPositions[ti+8];
    var e1x=v2x-v1x,e1y=v2y-v1y,e1z=v2z-v1z;
    var e2x=v3x-v1x,e2y=v3y-v1y,e2z=v3z-v1z;
    var nx=e1y*e2z-e1z*e2y,ny=e1z*e2x-e1x*e2z,nz=e1x*e2y-e1y*e2x;
    var len=Math.sqrt(nx*nx+ny*ny+nz*nz)||1; nx/=len;ny/=len;nz/=len;
    dv.setFloat32(offset,nx,true);offset+=4;dv.setFloat32(offset,ny,true);offset+=4;dv.setFloat32(offset,nz,true);offset+=4;
    dv.setFloat32(offset,v1x,true);offset+=4;dv.setFloat32(offset,v1y,true);offset+=4;dv.setFloat32(offset,v1z,true);offset+=4;
    dv.setFloat32(offset,v2x,true);offset+=4;dv.setFloat32(offset,v2y,true);offset+=4;dv.setFloat32(offset,v2z,true);offset+=4;
    dv.setFloat32(offset,v3x,true);offset+=4;dv.setFloat32(offset,v3y,true);offset+=4;dv.setFloat32(offset,v3z,true);offset+=4;
    dv.setUint16(offset,0,true);offset+=2;
  }
  var blob = new Blob([buffer],{type:'application/octet-stream'});
  var link = document.createElement('a');
  link.download = (document.getElementById('projectName').textContent||'modelo')+'.stl';
  link.href = URL.createObjectURL(blob);
  link.click();
  URL.revokeObjectURL(link.href);
  toast('STL exportado','success');
}

// ========== AI PANEL (direct OpenRouter API) ==========
function toggleAIPanel() {
  var panel = document.getElementById('aiPanel');
  var isOpen = panel.classList.toggle('open');
  document.getElementById('tAI').classList.toggle('active', isOpen);
  if (isOpen) {
    var saved = localStorage.getItem('openrouter_api_key');
    if (saved) document.getElementById('apiKeyInput').placeholder = 'Key: ' + saved.substring(0,8) + '...' + saved.substring(saved.length - 4);
  }
}

function saveAPIKey() {
  var key = document.getElementById('apiKeyInput').value.trim();
  if (!key) { toast('Ingresa una API key','warning'); return; }
  localStorage.setItem('openrouter_api_key', key);
  document.getElementById('apiKeyInput').value = '';
  document.getElementById('apiKeyInput').placeholder = 'Key: ' + key.substring(0,8) + '...' + key.substring(key.length - 4);
  toast('API key guardada','success');
}

function aiQuick(text) { document.getElementById('aiInput').value = text; sendAI(); }

function sendAI() {
  var input = document.getElementById('aiInput');
  var prompt = input.value.trim();
  if (!prompt) return;
  var apiKey = localStorage.getItem('openrouter_api_key');
  if (!apiKey) { toast('Configura tu API key de OpenRouter primero','warning'); return; }
  addAIMsg(prompt, 'user');
  input.value = '';
  document.getElementById('aiSendBtn').disabled = true;
  addAIMsg('Pensando...', 'system');
  var modeloIA = document.getElementById('aiModelSelect').value;

  var systemPrompt = 'Eres un experto en OpenSCAD y diseno 3D para impresion 3D. Tu tarea es generar codigo OpenSCAD.\n\n';
  systemPrompt += 'REGLAS:\n';
  systemPrompt += '1. SIEMPRE responde con JSON valido.\n';
  systemPrompt += '2. Genera codigo OpenSCAD completo y funcional.\n';
  systemPrompt += '3. Usa comentarios en el codigo para indicar QUE parte es y PARA QUE sirve.\n';
  systemPrompt += '4. Incluye instrucciones claras de que linea modificar para cada cambio.\n';
  systemPrompt += '5. Usa unidades en milimetros.\n';
  systemPrompt += '6. Organiza el codigo con modulos ($fn, variables, etc).\n\n';
  systemPrompt += 'FORMATO DE RESPUESTA:\n';
  systemPrompt += '{"respuesta":"Explicacion breve","openscad":"// codigo aqui...","instrucciones":[{"linea":5,"que":"Radio","como":"Cambiar valor"}]}\n\n';
  systemPrompt += 'PRIMITIVAS BASICAS:\n';
  systemPrompt += '- cube([x,y,z]), cylinder(r,h), sphere(r)\n';
  systemPrompt += '- union(), difference(), intersection()\n';
  systemPrompt += '- translate([x,y,z]), rotate([x,y,z]), scale([x,y,z])\n';
  systemPrompt += '- linear_extrude(height), rotate_extrude(), hull(), minkowski()\n';

  fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + apiKey,
      'Content-Type': 'application/json',
      'HTTP-Referer': window.location.href,
      'X-OpenRouter-Title': 'EMJ App 3D Creator'
    },
    body: JSON.stringify({
      model: modeloIA,
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: prompt }
      ],
      temperature: 0.7,
      max_tokens: 2000
    })
  })
  .then(function(resp) { return resp.json(); })
  .then(function(data) {
    removeThinking();
    if (data.error) {
      addAIMsg('Error: ' + (data.error.message || 'Error desconocido'), 'error');
      document.getElementById('aiSendBtn').disabled = false;
      return;
    }
    var contenido = data.choices[0].message.content;
    var jsonMatch = contenido.match(/\{[\s\S]*\}/);
    if (!jsonMatch) {
      addAIMsg(contenido.substring(0, 800), 'assistant');
      document.getElementById('aiSendBtn').disabled = false;
      return;
    }
    var inst = JSON.parse(jsonMatch[0]);
    if (inst.openscad) { displayOpenSCAD(inst, data.model, data.usage ? data.usage.total_tokens : 0); }
    else { addAIMsg(JSON.stringify(inst).substring(0, 800), 'assistant'); }
    document.getElementById('aiSendBtn').disabled = false;
  })
  .catch(function(e) {
    removeThinking();
    addAIMsg('Error de conexion: ' + e.message, 'error');
    document.getElementById('aiSendBtn').disabled = false;
  });
}

function displayOpenSCAD(inst, modelo, tokens) {
  var c = document.getElementById('aiMessages');
  if (inst.respuesta) { var d=document.createElement('div');d.className='ai-msg assistant';d.textContent=inst.respuesta;c.appendChild(d); }
  if (inst.openscad) {
    var w=document.createElement('div');w.style.cssText='position:relative;margin:6px 0;';
    var pre=document.createElement('pre');pre.style.cssText='background:#1e1e2e;color:#cdd6f4;padding:10px;border-radius:6px;font-size:10px;overflow:auto;max-height:250px;margin:0;font-family:monospace;';
    pre.textContent=inst.openscad;
    var btn=document.createElement('button');btn.textContent='Copiar';btn.style.cssText='position:absolute;top:4px;right:4px;padding:3px 8px;border-radius:3px;border:none;background:rgba(255,255,255,.15);color:#cdd6f4;cursor:pointer;font-size:9px;';
    btn.onclick=function(){navigator.clipboard.writeText(inst.openscad).then(function(){btn.textContent='Copiado!';btn.style.background='#34c759';setTimeout(function(){btn.textContent='Copiar';btn.style.background='rgba(255,255,255,.15)';},1500);});};
    w.appendChild(btn);w.appendChild(pre);c.appendChild(w);
  }
  if (inst.instrucciones && inst.instrucciones.length) {
    var d=document.createElement('div');d.style.cssText='background:rgba(0,113,227,.08);border:1px solid rgba(0,113,227,.2);border-radius:6px;padding:8px 10px;margin-top:4px;';
    d.innerHTML='<div style="font-size:10px;font-weight:600;color:var(--accent);margin-bottom:4px">Para modificar:</div>';
    inst.instrucciones.forEach(function(i){d.innerHTML+='<div style="font-size:10px;color:var(--t2);margin-bottom:2px"><b>Linea '+i.linea+':</b> '+i.que+' <span style="color:var(--t3)">'+i.como+'</span></div>';});
    c.appendChild(d);
  }
  var t=document.createElement('div');t.className='ai-msg system';t.textContent='('+modelo+', '+tokens+' tokens)';c.appendChild(t);
  c.scrollTop=c.scrollHeight;
}

function addAIMsg(text, type) {
  var c=document.getElementById('aiMessages');
  var d=document.createElement('div');d.className='ai-msg '+(type||'assistant');d.textContent=text;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}
function removeThinking() {
  var msgs=document.querySelectorAll('#aiMessages .ai-msg.system');
  var last=msgs[msgs.length-1];
  if (last && last.textContent==='Pensando...') last.remove();
}

// ========== DIALOGS ==========
function closeDialog(id) { document.getElementById(id).classList.remove('show'); }

// ========== TOAST ==========
function toast(msg, type) {
  var t=document.getElementById('toast');
  t.querySelector('i').className = type==='error'?'fas fa-exclamation-circle':type==='warning'?'fas fa-exclamation-triangle':type==='info'?'fas fa-info-circle':'fas fa-check-circle';
  t.className = 'toast '+(type||'success');
  document.getElementById('toastMessage').textContent = msg;
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(function(){t.classList.remove('show');}, 3000);
}

function setStatus(msg) { document.getElementById('statusText').textContent = msg; }

function newProject() {
  if (sceneObjects.length > 0 && !confirm('Nuevo proyecto? Se perderan los cambios.')) return;
  sceneObjects.forEach(function(o){scene.remove(o.mesh);});
  sceneObjects=[];
  selectObject(null);
  updateObjectList();
  document.getElementById('projectName').textContent = 'Sin proyecto';
  toast('Nuevo proyecto','info');
}

// ========== KEYBOARD ==========
window.addEventListener('keydown', function(e) {
  if (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.contentEditable==='true') return;
  if (e.key==='v'||e.key==='V') setTool('select');
  else if (e.key==='w'||e.key==='W') setTool('move');
  else if (e.key==='e'||e.key==='E') setTool('rotate');
  else if (e.key==='r'||e.key==='R') setTool('scale');
  else if (e.key==='Delete'||e.key==='Backspace') deleteSelected();
  else if (e.ctrlKey&&e.key==='d'){e.preventDefault();duplicateSelected();}
  else if (e.ctrlKey&&e.key==='z'){e.preventDefault();undo();}
  else if (e.ctrlKey&&e.key==='y'){e.preventDefault();redo();}
  else if (e.key==='f'||e.key==='F') frameAll();
  else if (e.key==='Escape') { selectObject(null); setTool('select'); document.getElementById('shapeStrip').classList.remove('open'); }
  else if (e.key==='='||e.key==='+') zoomIn();
  else if (e.key==='-') zoomOut();
  else if (e.key==='1') setView('front');
  else if (e.key==='2') setView('top');
  else if (e.key==='3') setView('right');
  else if (e.key==='4') setView('iso');
});

// ========== INIT ==========
window.addEventListener('load', init);
</script>
